[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "market-microstructure-ml"
version = "0.1.0"
description = "Auditable historical order-book research with causal features and purged temporal evaluation."
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.2.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
microstructure = "market_microstructure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
